<div class="chat-container">
    <!-- Chat Button (Floating) -->
    <button pButton pRipple type="button" icon="pi pi-comments" class="p-button-rounded p-button-lg chat-toggle-btn" 
            (click)="toggleChat()" *ngIf="!isOpen"></button>

    <!-- Chat Window -->
    <div class="chat-window" *ngIf="isOpen">
        <div class="chat-header">
            <div class="header-info">
                <i class="pi pi-android" style="font-size: 1.5rem; margin-right: 0.5rem;"></i>
                <span class="font-bold">Hỗ trợ khách hàng</span>
            </div>
            <button pButton pRipple type="button" icon="pi pi-times" class="p-button-rounded p-button-text p-button-sm text-white" 
                    (click)="toggleChat()"></button>
        </div>

        <div class="chat-messages" #scrollContainer [scrollTop]="scrollContainer.scrollHeight">
            <div *ngFor="let msg of messages" class="message-bubble" [ngClass]="{'user-message': msg.isUser, 'bot-message': !msg.isUser}">
                <span [innerHTML]="msg.html"></span>
                <div class="message-time">{{ msg.time | date:'shortTime' }}</div>
            </div>
            <div *ngIf="isLoading" class="message-bubble bot-message loading-bubble">
                <p-progressSpinner styleClass="w-2rem h-2rem" strokeWidth="4"></p-progressSpinner>
            </div>
        </div>

        <div class="chat-input-area">
            <span class="p-input-icon-right w-full">
                <input type="text" pInputText placeholder="Nhập câu hỏi..." [(ngModel)]="question" (keydown.enter)="sendMessage()" class="w-full" [disabled]="isLoading"/>
                <i class="pi pi-send cursor-pointer" (click)="sendMessage()" *ngIf="question"></i>
            </span>
        </div>
    </div>
</div>
